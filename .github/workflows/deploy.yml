name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-networking-mcp

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: arc-runner          #ARC runner with same installation name
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # tag with both git sha
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cluster
    runs-on: arc-runner
    needs: build-and-push         # only deploy if build succeeded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ARC runner has a ServiceAccount — kubectl uses it automatically
      # no kubeconfig setup needed
      - name: Apply namespace and RBAC
        run: |
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/serviceaccount.yaml
          kubectl apply -f deploy/rbac.yaml

      - name: Update image tag in deployment
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME/k8s-networking-mcp:latest|${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            deploy/deployment.yaml

      - name: Apply deployment and service
        run: |
          kubectl apply -f deploy/deployment.yaml
          kubectl apply -f deploy/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/k8s-networking-mcp \
            -n k8s-networking-mcp \
            --timeout=120s

      - name: Verify pods are running
        run: |
          kubectl get pods -n k8s-networking-mcp